seed: 42

data:
  batch_size: 64
  num_workers: 2

model:
  k_over_n: 0.16666667      # 1/6, matches week1_overfit.yaml
  image_size: 32

quantizer:
  num_levels: 256
  init_range: [-3.0, 3.0]
  calibrate_low_pct: 1.0
  calibrate_high_pct: 99.0
  sigma_start: 1.0
  sigma_end: 0.05
  sigma_anneal_epochs: 50    # anneal linearly over 50 epochs, hold for the last 10

af_conditioning:
  nominal_snr_db: 10.0       # fixed for identity channel training

train:
  lr: 0.001
  epochs: 60
  log_every: 100             # log every 100 steps (batches)

output:
  checkpoint_dir: results/checkpoints/adjsccq_identity_train

wandb:
  project: rs-uep-jscc

report_baseline_psnr_db: null
