seed: 42
data:
  batch_size: 64
  num_workers: 2
model:
  k_over_n: 0.1667   # 1/6 -- same ratio as the Week 1-3 baseline, so
                     # PSNR-vs-SNR is comparable apples-to-apples later
  image_size: 32
channel:
  # ADJSCC is trained across a range of SNRs, sampled uniformly per
  # sample every batch, rather than one fixed snr_db.
  snr_db_min: 0
  snr_db_max: 20
train:
  lr: 0.001
  epochs: 60
  log_every: 100          # in steps, not epochs (full-dataset training now)
  eval_snrs: [0, 5, 10, 15, 20]   # fixed grid for eval-time PSNR curve
output:
  checkpoint_dir: results/checkpoints/week4_adjscc
  log_dir: results/logs/week4_adjscc
wandb:
  project: rs-uep-jscc